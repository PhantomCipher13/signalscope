[pytest]
# ── Test discovery ────────────────────────────────────────────────────────────
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ── asyncio mode ──────────────────────────────────────────────────────────────
# Required by pytest-asyncio for async test support (Phase 1+ API tests).
asyncio_mode = auto

# ── Output ────────────────────────────────────────────────────────────────────
addopts =
    -v
    --tb=short
    --strict-markers

# ── Markers ───────────────────────────────────────────────────────────────────
markers =
    unit: Unit tests (fast, no network, no model).
    integration: Integration tests (FastAPI TestClient).
    phase1: Tests for Phase 1 features (skip in Phase 0).
    phase2: Tests for Phase 2 features (skip in Phase 0).
    slow: Tests that take more than a few seconds.

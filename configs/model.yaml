# ============================================================
# SignalScope — Model Configuration
# Phase 0 Foundation — values are architecture defaults.
# Actual trained values will be set in Phase 1.
# ============================================================

model:
  # ── Architecture ────────────────────────────────────────
  # EfficientNet-B0 selected after Phase 1 training.
  architecture: "efficientnet_b0"
  pretrained: true                   # ImageNet pretrained backbone
  num_classes: 2                     # [real, ai_generated]

  # ── Input ───────────────────────────────────────────────
  input_size: 224                    # EfficientNet-B0 native resolution
  input_channels: 3

  # ── Classification head ─────────────────────────────────
  dropout_rate: 0.3

  # ── Checkpoint ──────────────────────────────────────────
  checkpoint_path: "models/signalscope_b0_v3.pt"

  # ── Inference ───────────────────────────────────────────
  device: "auto"                     # "auto" | "cpu" | "cuda" | "mps"
  batch_size: 1                      # single-image inference at serving time

# ── Calibration (fitted on validation set only) ─────────────────
calibration:
  temperature: 0.9804
  ece_before: 0.0602
  ece_after: 0.0601
  brier_before: 0.0669
  brier_after: 0.0669
